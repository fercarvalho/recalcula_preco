name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build
        working-directory: ./frontend
        run: npm run build:demo
      
      - name: Verify CNAME and rename HTML
        working-directory: ./frontend
        run: |
          # Listar arquivos do dist para debug
          echo "Arquivos no dist antes do ajuste:"
          ls -la dist/ | head -20
          
          # Verificar se CNAME foi copiado
          if [ ! -f "dist/CNAME" ]; then
            echo "CNAME não encontrado, copiando..."
            cp public/CNAME dist/CNAME
          fi
          
          # Renomear index-demo.html para index.html se necessário
          if [ -f "dist/index-demo.html" ] && [ ! -f "dist/index.html" ]; then
            echo "Renomeando index-demo.html para index.html..."
            mv dist/index-demo.html dist/index.html
          fi
          
          # Verificar se index.html existe
          if [ ! -f "dist/index.html" ]; then
            echo "ERRO: index.html não encontrado após build!"
            exit 1
          fi
          
          # Verificar conteúdo do CNAME
          echo "Conteúdo do CNAME:"
          cat dist/CNAME || echo "CNAME não encontrado"
          
          echo "Arquivos no dist após ajuste:"
          ls -la dist/ | head -20
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

